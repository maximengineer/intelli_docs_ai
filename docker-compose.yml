# Runtime settings shared by the API and the Celery worker. Keeping one copy
# prevents drift: both processes must embed, store and call providers the same
# way, or chunks indexed by the worker would not match queries from the API.
x-app-environment: &app-environment
  DATABASE_URL: postgresql://intellidocs:intellidocs@postgres:5432/intellidocs
  ENABLE_LLM: ${ENABLE_LLM:-false}
  LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434/v1}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-phi4-mini}
  STRICT_PROVIDER_MODE: ${STRICT_PROVIDER_MODE:-false}
  # Defaults suit a cloud provider; `make up-ollama` raises them because a CPU
  # model can need minutes per call (see README, "Run with local Ollama LLM").
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
  LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
  CELERY_TASK_SOFT_TIME_LIMIT_SECONDS: ${CELERY_TASK_SOFT_TIME_LIMIT_SECONDS:-50}
  CELERY_TASK_TIME_LIMIT_SECONDS: ${CELERY_TASK_TIME_LIMIT_SECONDS:-60}
  EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-hash}
  VECTOR_STORE_BACKEND: postgres
  DOCUMENT_PROCESSING_BACKEND: ${DOCUMENT_PROCESSING_BACKEND:-thread}
  UPLOAD_STORAGE_DIR: /app/data/uploads
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1

services:
  redis:
    image: redis:8.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: intellidocs
      POSTGRES_USER: intellidocs
      POSTGRES_PASSWORD: intellidocs
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intellidocs -d intellidocs"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    env_file:
      - .env
    environment:
      <<: *app-environment
      REQUIRE_DATABASE_READY: "true"
    volumes:
      - uploads_data:/app/data/uploads
    ports:
      - "${BACKEND_PORT:-7777}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json, urllib.request; payload=json.load(urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)); raise SystemExit(0 if payload.get('status') == 'ready' else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    env_file:
      - .env
    environment:
      <<: *app-environment
    volumes:
      - uploads_data:/app/data/uploads
    command: celery -A worker.worker.celery_app worker --loglevel=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ollama:
    image: ollama/ollama:0.30.10
    profiles:
      - ollama
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      INTELLIDOCS_API_URL: http://backend:8000
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      MAX_DOCUMENTS: ${MAX_DOCUMENTS:-10}
      QA_TIMEOUT_SECONDS: ${QA_TIMEOUT_SECONDS:-60}
      STATUS_POLL_SECONDS: ${STATUS_POLL_SECONDS:-120}
    ports:
      - "${FRONTEND_PORT:-9999}:8501"
    depends_on:
      backend:
        condition: service_healthy

  tests:
    profiles:
      - test
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: test
    environment:
      ENABLE_LLM: "false"
      EMBEDDING_BACKEND: hash
      VECTOR_STORE_BACKEND: memory
      DATABASE_URL: ""
      DOCUMENT_PROCESSING_BACKEND: thread
      UPLOAD_STORAGE_DIR: /tmp/intellidocs-test-uploads
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    command: pytest

  live-tests:
    profiles:
      - live-test
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    environment:
      INTELLIDOCS_API_URL: http://backend:8000
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-hash}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-openai/text-embedding-3-small}
      LIVE_REQUIRE_PROVIDER_EMBEDDINGS: ${LIVE_REQUIRE_PROVIDER_EMBEDDINGS:-false}
      LIVE_HTTP_TIMEOUT_SECONDS: ${LIVE_HTTP_TIMEOUT_SECONDS:-120}
      LIVE_POLL_DEADLINE_SECONDS: ${LIVE_POLL_DEADLINE_SECONDS:-240}
    command: python scripts/run_live_smoke.py
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
  ollama_data:
